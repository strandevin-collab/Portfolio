<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-meta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181308"/>
      <stop offset="50%" stop-color="#241b0b"/>
      <stop offset="100%" stop-color="#0f0c05"/>
    </linearGradient>
    <linearGradient id="amber-meta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow-meta">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="340" fill="url(#bg-meta)"/>
  <!-- Cybernetic Closed Loop & Agentic Nodes -->
  <g transform="translate(300, 150)">
    <!-- Outer Octagonal Boundary -->
    <polygon points="0,-100 70,-70 100,0 70,70 0,100 -70,70 -100,0 -70,-70" fill="none" stroke="#78350f" stroke-width="1.5" stroke-dasharray="8,4"/>
    <!-- Closed-Loop Circuit Trace -->
    <path d="M 0 -75 C 60 -75, 75 -40, 75 0 C 75 50, 40 75, 0 75 C -50 75, -75 40, -75 0 C -75 -50, -40 -75, 0 -75 Z" fill="none" stroke="url(#amber-meta)" stroke-width="2.5" filter="url(#glow-meta)"/>
    <!-- Core Hub -->
    <circle cx="0" cy="0" r="28" fill="#181308" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="#f59e0b" filter="url(#glow-meta)"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff"/>
    <!-- Radiating Prompt Rays -->
    <line x1="0" y1="-28" x2="0" y2="-75" stroke="#f59e0b" stroke-width="2"/>
    <line x1="28" y1="0" x2="75" y2="0" stroke="#f59e0b" stroke-width="2"/>
    <line x1="0" y1="28" x2="0" y2="75" stroke="#f59e0b" stroke-width="2"/>
    <line x1="-28" y1="0" x2="-75" y2="0" stroke="#f59e0b" stroke-width="2"/>
    <!-- Node Satellites -->
    <circle cx="0" cy="-75" r="7" fill="#fbbf24"/>
    <circle cx="75" cy="0" r="7" fill="#fbbf24"/>
    <circle cx="0" cy="75" r="7" fill="#fbbf24"/>
    <circle cx="-75" cy="0" r="7" fill="#fbbf24"/>
  </g>
  <!-- Code Telemetry Readout -->
  <text x="40" y="45" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fbbf24">&lt;AGENTIC_ORCHESTRATION&gt;</text>
  <text x="40" y="65" font-family="'JetBrains Mono', monospace" font-size="10" fill="#a16207">TARGET: VANILLA_SPA // ZERO_BUILD_DEPS</text>
  <text x="560" y="45" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fbbf24" text-anchor="end">LOOP: CLOSED</text>
  <text x="300" y="295" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8" text-anchor="middle" letter-spacing="2">CLOSED-LOOP PROMPT ARCHITECTURE</text>
</svg>
