<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-mil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1720"/>
      <stop offset="50%" stop-color="#11222e"/>
      <stop offset="100%" stop-color="#070e14"/>
    </linearGradient>
    <linearGradient id="cyan-mil" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow-mil">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="340" fill="url(#bg-mil)"/>
  <!-- Tactical Radar & Artillery Trajectory Arc -->
  <g transform="translate(300, 160)">
    <!-- Radar concentric rings -->
    <circle cx="0" cy="0" r="120" fill="none" stroke="#1e3a5f" stroke-width="1" stroke-dasharray="3,3"/>
    <circle cx="0" cy="0" r="80" fill="none" stroke="#1e3a5f" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Compass Crosshairs -->
    <line x1="-140" y1="0" x2="140" y2="0" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="0" y1="-140" x2="0" y2="140" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1"/>
    <!-- Azimuth Angle Marks -->
    <line x1="0" y1="-80" x2="0" y2="-90" stroke="#38bdf8" stroke-width="2"/>
    <line x1="80" y1="0" x2="90" y2="0" stroke="#38bdf8" stroke-width="2"/>
    <line x1="0" y1="80" x2="0" y2="90" stroke="#38bdf8" stroke-width="2"/>
    <line x1="-80" y1="0" x2="-90" y2="0" stroke="#38bdf8" stroke-width="2"/>
    <!-- Precision Ballistic Trajectory -->
    <path d="M -130 50 Q 0 -110 130 50" fill="none" stroke="url(#cyan-mil)" stroke-width="2.5" filter="url(#glow-mil)"/>
    <circle cx="0" cy="-30" r="4" fill="#38bdf8"/>
    <!-- Shield & Cross of Service Silhouette (Subtle) -->
    <path d="M -15 -15 L 15 -15 L 15 5 Q 15 25 0 35 Q -15 25 -15 5 Z" fill="#070e14" stroke="#38bdf8" stroke-width="1.5" opacity="0.8"/>
    <!-- Cross inside shield -->
    <line x1="0" y1="-7" x2="0" y2="20" stroke="#f59e0b" stroke-width="2"/>
    <line x1="-7" y1="0" x2="7" y2="0" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <!-- Tactical Readout HUD -->
  <text x="50" y="50" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8" letter-spacing="1">SYSTEM: AFATDS // WI-ARNG</text>
  <text x="50" y="70" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b" letter-spacing="1">AZ: 045° // ELEV: 820 MIL // DATA: 100%</text>
  <text x="300" y="295" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8" text-anchor="middle" letter-spacing="2">TACTICAL DATA SYSTEMS &amp; PASTORAL CARE</text>
</svg>
