<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-bench" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181726"/>
      <stop offset="50%" stop-color="#211d33"/>
      <stop offset="100%" stop-color="#110f1c"/>
    </linearGradient>
    <linearGradient id="gold-bench" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <filter id="glow-bench">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="340" fill="url(#bg-bench)"/>
  <!-- Telemetry Bar Graph representing 60 days acceleration & bench strength -->
  <g transform="translate(100, 70)">
    <!-- Grid -->
    <line x1="0" y1="160" x2="400" y2="160" stroke="#475569" stroke-width="1.5"/>
    <line x1="0" y1="110" x2="400" y2="110" stroke="#334155" stroke-dasharray="4,4"/>
    <line x1="0" y1="60" x2="400" y2="60" stroke="#334155" stroke-dasharray="4,4"/>
    <!-- Bars -->
    <rect x="50" y="90" width="45" height="70" rx="4" fill="#3b4252" opacity="0.8"/>
    <text x="72" y="80" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8" text-anchor="middle">Base</text>

    <rect x="140" y="55" width="45" height="105" rx="4" fill="#4c566a" opacity="0.9"/>
    <text x="162" y="45" font-family="'JetBrains Mono', monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">Phase I</text>

    <!-- Accelerated Bar -->
    <rect x="230" y="20" width="45" height="140" rx="4" fill="url(#gold-bench)" filter="url(#glow-bench)"/>
    <text x="252" y="10" font-family="'JetBrains Mono', monospace" font-size="12" fill="#fbbf24" font-weight="bold" text-anchor="middle">-60 DAYS</text>

    <rect x="320" y="40" width="45" height="120" rx="4" fill="#d97706" opacity="0.7"/>
    <text x="342" y="30" font-family="'JetBrains Mono', monospace" font-size="11" fill="#fbbf24" text-anchor="middle">Bench</text>
  </g>
  <!-- Talent Network Constellation -->
  <g transform="translate(390, 40)" opacity="0.6">
    <circle cx="50" cy="50" r="4" fill="#fbbf24"/>
    <circle cx="90" cy="30" r="5" fill="#f59e0b"/>
    <circle cx="130" cy="65" r="4" fill="#fbbf24"/>
    <line x1="50" y1="50" x2="90" y2="30" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="90" y1="30" x2="130" y2="65" stroke="#fbbf24" stroke-width="1.5"/>
  </g>
  <text x="300" y="290" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8" text-anchor="middle" letter-spacing="2">CANDIDATE BENCH &amp; ONBOARDING TELEMETRY</text>
</svg>
