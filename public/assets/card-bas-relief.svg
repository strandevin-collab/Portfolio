<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-craft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1a15"/>
      <stop offset="50%" stop-color="#112920"/>
      <stop offset="100%" stop-color="#060e0b"/>
    </linearGradient>
    <linearGradient id="emerald-craft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow-craft">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="600" height="340" fill="url(#bg-craft)"/>
  <!-- Topographical Bas-Relief Elevation Contours & Tidal Swell Curves -->
  <g transform="translate(300, 160)" stroke-linecap="round">
    <!-- Concentric carved contours -->
    <path d="M -220 70 C -150 -60, -60 -100, 0 -100 C 60 -100, 150 -60, 220 70" fill="none" stroke="#064e3b" stroke-width="1.5"/>
    <path d="M -180 60 C -120 -40, -40 -70, 0 -70 C 40 -70, 120 -40, 180 60" fill="none" stroke="#047857" stroke-width="2"/>
    <path d="M -140 50 C -90 -20, -30 -40, 0 -40 C 30 -40, 90 -20, 140 50" fill="none" stroke="#059669" stroke-width="2.5" stroke-dasharray="8,4"/>
    <path d="M -90 35 C -60 0, -20 -15, 0 -15 C 20 -15, 60 0, 90 35" fill="none" stroke="url(#emerald-craft)" stroke-width="3" filter="url(#glow-craft)"/>

    <!-- Tolkien Elvish Star of Fëanor / Tree Motif (Subtle Stylized Geometric Center) -->
    <g transform="translate(0, -10)">
      <!-- 8-pointed star -->
      <line x1="0" y1="-30" x2="0" y2="30" stroke="#34d399" stroke-width="2"/>
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#34d399" stroke-width="2"/>
      <line x1="-20" y1="-20" x2="20" y2="20" stroke="#34d399" stroke-width="1.5"/>
      <line x1="-20" y1="20" x2="20" y2="-20" stroke="#34d399" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="5" fill="#10b981"/>
      <!-- Symmetrical leaves/roots -->
      <path d="M 0 30 Q 15 45 30 55 M 0 30 Q -15 45 -30 55" stroke="#34d399" stroke-width="1.5" fill="none"/>
    </g>
  </g>
  <text x="50" y="45" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399">DEPTH: ±3.0MM // HUTCHINSON ISLAND TIDAL STUDY</text>
  <text x="50" y="65" font-family="'JetBrains Mono', monospace" font-size="10" fill="#065f46">TOLKIEN PHILOLOGY // LORE &amp; MYTHOPOEIA</text>
  <text x="300" y="295" font-family="'JetBrains Mono', monospace" font-size="11" fill="#94a3b8" text-anchor="middle" letter-spacing="2">BAS-RELIEF ART, OCEAN HYDROLOGY &amp; MYTH</text>
</svg>
